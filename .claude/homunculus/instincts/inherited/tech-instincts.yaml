# Tech Workflow Feature Extension Across Multiple Views

## Action

Follow the feature-extension-across-multiple-views workflow:
1. Add or update data/assets (e.g., SVG images in images/)
2. Update data source (e.g., data.js) to reference new assets or fields
3. Update all relevant UI scripts (e.g., boutique.js, panier.js, produit.js, contact.js) to use the new feature
4. Update HTML templates if necessary
5. Update styles to accommodate new UI elements
6. Update documentation (README.md) to reflect the new feature
7. Add or update build scripts if asset generation is needed (e.g., build-images.js)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: boutique/data.js, boutique/images/*.svg, boutique/boutique.js

